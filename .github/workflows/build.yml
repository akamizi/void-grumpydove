name: Build repository

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'srcpkgs/**'
      - 'ci/**'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  check:
    name: Check upstream release
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.bump.outputs.updated }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Bump template to latest release
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/check-update.sh >> "$GITHUB_OUTPUT"

      - name: Commit update
        if: steps.bump.outputs.updated != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "grumpydove: update to ${{ steps.bump.outputs.updated }}"
          git push

      - name: Decide whether to build
        id: decide
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ -n "${{ steps.bump.outputs.updated }}" ]; then
            echo build=true >> "$GITHUB_OUTPUT"
          else
            echo build=false >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and publish
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build packages and repository
        env:
          XBPS_PRIVKEY: ${{ secrets.XBPS_PRIVKEY }}
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" -e XBPS_PRIVKEY \
            ghcr.io/void-linux/void-glibc-full:latest \
            sh /work/ci/entry.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
