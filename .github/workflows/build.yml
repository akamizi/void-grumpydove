name: Build repository

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'srcpkgs/**'
      - 'ci/**'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      # The bump stays in the working tree and is committed only once the
      # packages have built: a release that fails to build is retried (and
      # fails visibly) on every scheduled run until the template is fixed.
      - name: Bump template to latest release
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/check-update.sh >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decide
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ -n "${{ steps.bump.outputs.updated }}" ]; then
            echo build=true >> "$GITHUB_OUTPUT"
          else
            echo "Nothing new upstream, skipping build."
            echo build=false >> "$GITHUB_OUTPUT"
          fi

      - name: Build packages and repository
        if: steps.decide.outputs.build == 'true'
        env:
          XBPS_PRIVKEY: ${{ secrets.XBPS_PRIVKEY }}
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" -e XBPS_PRIVKEY \
            ghcr.io/void-linux/void-glibc-full:latest \
            sh /work/ci/entry.sh

      - name: Commit update
        if: steps.decide.outputs.build == 'true' && steps.bump.outputs.updated != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "grumpydove: update to ${{ steps.bump.outputs.updated }}" -- srcpkgs/grumpydove/template
          git push

      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.build == 'true'
        with:
          path: public

  # Separate job: deploy-pages does not always see an artifact uploaded
  # earlier in the same job.
  deploy:
    name: Deploy to Pages
    needs: build
    if: needs.build.outputs.build == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
